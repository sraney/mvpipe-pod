name: build-pod-image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Candidate tag (the current latest image is never overwritten)
        required: true
        default: h3-timeline-candidate
        type: string
  pull_request:
    paths:
      - pod-template/**
      - .github/workflows/build-pod-image.yml

permissions:
  contents: read

concurrency:
  group: pod-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test worker controls
        run: python3 -m unittest discover -s pod-template/tests -v
      - name: Set candidate image references
        id: image
        env:
          REQUESTED_TAG: ${{ inputs.image_tag || 'pull-request-check' }}
        run: |
          if ! [[ "$REQUESTED_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]] || [ "$REQUESTED_TAG" = latest ]; then
            echo 'Use a candidate tag of up to 64 lowercase letters, numbers, dots, underscores, or dashes; latest is reserved.' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "candidate=$image:$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Free hosted-runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: pod-template
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: IMAGE_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.candidate }}
            ${{ steps.image.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify dependencies, shell, and CPU startup
        env:
          IMAGE: ${{ steps.image.outputs.candidate }}
        run: |
          docker run --rm --entrypoint /opt/venv/bin/python "$IMAGE" -m pip check
          docker run --rm --entrypoint /bin/bash "$IMAGE" -n /start.sh
          docker run --rm --entrypoint /bin/bash "$IMAGE" /opt/mvpipe/scripts/verify_image.sh
      - name: Publish checked candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE: ${{ steps.image.outputs.candidate }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          docker push "$CANDIDATE"
          docker push "$REVISION"
          docker inspect --format='{{join .RepoDigests "\n"}}' "$CANDIDATE" > image-digest.txt
          {
            echo '## Candidate image built and CPU-checked'
            echo "Candidate: \`$CANDIDATE\`"
            echo "Source revision: \`$REVISION\`"
            echo '```'
            cat image-digest.txt
            echo '```'
            echo 'GPU validation on RunPod is still required. The existing latest tag was not changed.'
          } >> "$GITHUB_STEP_SUMMARY"
