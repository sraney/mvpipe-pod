# Optional: builds and publishes the image from GitHub, so you never need Docker on your PC.
# Put this file at .github/workflows/build-pod-image.yml in a GitHub repo that contains the
# pod-template/ folder (public repo = free minutes). Run it from the Actions tab ("Run workflow").
name: build-pod-image
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the image is about 10 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: pod-template
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mvpipe-pod:latest
